[general]
show_welcome = false
skip_boot_anim = true

[general.updates]
check = false

[display]
renderer = 'VULKAN'

[display.ui]
auto_scale = false
scale = 2

[net]
enable = false

[sys]
mem_limit = '64'

[sys.files]
bootrom_path = '/data/xemu-chihiro/mcpx_1.0.bin'
flashrom_path = '/data/xemu-chihiro/Complex_4627.bin'
hdd_path = '/data/xemu-chihiro/xbox_hdd.qcow2'
eeprom_path = '/data/xemu-chihiro/eeprom.bin'

[chihiro.roms]
bios_path = '/data/xemu-chihiro/chihiro/chihiro_xbox_bios.bin'

[chihiro.settings]
region = 'ex'

# The controller layout for a Chihiro game the cabinet table doesn't know.
[chihiro.jvs]
profile = 'wmmt2'
